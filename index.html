    // --- 検索結果画面用 出庫モーダルコンポーネント ---
    function OrderCheckOutModal({ orderGroup, workers = WORKER_PRESETS, onClose, onConfirm }) {
      const storedPlates = orderGroup.plates.filter(p => p.status === 'IN_STORAGE');
      const [selectedIds, setSelectedIds] = useState(() => storedPlates.map(p => p.plateId));

      const [workerName, setWorkerName] = useState((workers && workers[0]) || WORKER_PRESETS[0]);
      const [customWorker, setCustomWorker] = useState('');
      const [isCustomWorker, setIsCustomWorker] = useState(false);

      const effectiveWorker = isCustomWorker ? customWorker.trim() : workerName;

      const toggleSelect = (id) => {
        setSelectedIds(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
      };

      const toggleAll = () => {
        if (selectedIds.length === storedPlates.length) {
          setSelectedIds([]);
        } else {
          setSelectedIds(storedPlates.map(p => p.plateId));
        }
      };

      const handleExecute = () => {
        if (selectedIds.length === 0) return alert('出庫する版を選択してください。');
        if (!effectiveWorker) return alert('【必須】作業者名を入力または選択してください。');
        onConfirm(selectedIds, effectiveWorker);
      };

      return (
        <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fadeIn">
          <div class="bg-white border border-slate-200 rounded-2xl w-full max-w-md shadow-2xl p-5 space-y-4">
            {/* ヘッダー */}
            <div class="flex items-center justify-between border-b border-slate-200 pb-3">
              <div>
                <h3 class="font-bold text-base text-slate-900 flex items-center gap-2">
                  <span>出庫（作業開始）</span>
                  <span class="font-mono text-blue-700 font-bold">#{orderGroup.orderNo}</span>
                </h3>
                <p class="text-xs text-slate-500">出庫する版と作業者名を選択してください</p>
              </div>
              <button onClick={onClose} class="text-slate-400 hover:text-slate-700 text-sm">✕</button>
            </div>

            {/* 版選択 */}
            <div>
              <div class="flex items-center justify-between mb-2">
                <label class="text-xs font-bold text-slate-700">出庫する版を選択:</label>
                <button type="button" onClick={toggleAll} class="text-xs text-blue-600 font-bold">
                  {selectedIds.length === storedPlates.length ? '全解除' : 'すべて選択'}
                </button>
              </div>
              <div class="grid grid-cols-2 gap-2">
                {storedPlates.map(pl => {
                  const isChecked = selectedIds.includes(pl.plateId);
                  return (
                    <div
                      key={pl.plateId}
                      onClick={() => toggleSelect(pl.plateId)}
                      className={`p-2.5 rounded-xl border-2 cursor-pointer transition-all flex items-center justify-between ${
                        isChecked ? 'bg-blue-50 border-blue-500 shadow-sm' : 'bg-slate-50 border-slate-200 opacity-60'
                      }`}
                    >
                      <div class="flex items-center gap-2">
                        <span
                          style={{ 
                            backgroundColor: pl.colorHex, 
                            color: pl.color === 'Y' || pl.color === '白' ? '#0F172A' : '#FFFFFF',
                            border: pl.color === '白' ? '1px solid #94A3B8' : 'none'
                          }}
                          class="w-5 h-5 rounded-full flex items-center justify-center text-[10px] font-bold"
                        >
                          {pl.color.slice(0, 1)}
                        </span>
                        <span class="text-xs font-bold text-slate-800">{pl.color}版</span>
                      </div>
                      <input type="checkbox" checked={isChecked} onChange={() => {}} class="rounded text-blue-600 pointer-events-none w-4 h-4" />
                    </div>
                  );
                })}
              </div>
            </div>

            {/* 作業者名選択 */}
            <WorkerSelector
              workerName={workerName}
              setWorkerName={setWorkerName}
              customWorker={customWorker}
              setCustomWorker={setCustomWorker}
              isCustomWorker={isCustomWorker}
              setIsCustomWorker={setIsCustomWorker}
              workers={workers}
            />

            {/* 出庫実行ボタン（大型） */}
            <div class="flex items-center gap-2 pt-2">
              <button
                type="button"
                onClick={onClose}
                class="flex-1 py-3 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold transition-colors"
              >
                キャンセル
              </button>
              <button
                type="button"
                onClick={handleExecute}
                class="flex-2 py-3 px-5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-xs sm:text-sm font-bold shadow-md shadow-blue-500/20 transition-all"
              >
                {selectedIds.length}版 を出庫する
              </button>
            </div>
          </div>
        </div>
      );
    }

    // --- ① ダイレクト入庫モーダル（新規版の入庫・保管登録） ---
    function DirectCheckInModal({ allPallets, palletPlatesMap, colors = COLOR_PRESETS, workers = WORKER_PRESETS, onClose, onConfirm }) {
      const [orderNo, setOrderNo] = useState('');
      const [branchNo, setBranchNo] = useState('01');
      const [selectedColors, setSelectedColors] = useState(['C', 'M', 'Y', 'K']);
      const [targetPalletId, setTargetPalletId] = useState('');

      const [workerName, setWorkerName] = useState((workers && workers[0]) || WORKER_PRESETS[0]);
      const [customWorker, setCustomWorker] = useState('');
      const [isCustomWorker, setIsCustomWorker] = useState(false);

      const effectiveWorker = isCustomWorker ? customWorker.trim() : workerName;

      const toggleColor = (code) => {
        setSelectedColors(prev => prev.includes(code) ? prev.filter(c => c !== code) : [...prev, code]);
      };

      const handleExecute = () => {
        if (!orderNo.trim()) return alert('【必須】受注番号を入力してください。');
        if (selectedColors.length === 0) return alert('【必須】色を少なくとも1つ選択してください。');
        if (!targetPalletId) return alert('【必須】入庫先パレットを選択してください。');
        if (!effectiveWorker) return alert('【必須】作業者名を入力または選択してください。');

        const now = new Date().toISOString();
        const createdPlates = selectedColors.map(colorCode => {
          const preset = (colors || COLOR_PRESETS).find(c => c.code === colorCode) || { bg: '#8B5CF6' };
          return {
            plateId: `PLT-${orderNo.trim()}-${colorCode}-${Date.now().toString().slice(-4)}`,
            orderNo: orderNo.trim(),
            branchNo: branchNo.trim() || '01',
            color: colorCode,
            colorHex: preset.bg,
            status: 'IN_STORAGE',
            currentPalletId: targetPalletId,
            currentWorker: null,
            lastMovedAt: now
          };
        });

        onConfirm(createdPlates, targetPalletId, effectiveWorker);
      };

      return (
        <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fadeIn">
          <div class="bg-white border border-slate-200 rounded-2xl w-full max-w-lg shadow-2xl p-5 space-y-4 max-h-[90vh] overflow-y-auto">
            {/* ヘッダー */}
            <div class="flex items-center justify-between border-b border-slate-200 pb-3">
              <div class="flex items-center gap-2.5">
                <div class="w-9 h-9 rounded-xl bg-emerald-100 text-emerald-700 flex items-center justify-center shadow-sm">
                  <i data-lucide="plus-circle" class="w-5 h-5"></i>
                </div>
                <div>
                  <h3 class="font-bold text-base text-slate-900">新規版の入庫・保管登録</h3>
                  <p class="text-xs text-slate-500">新しい受注の版をパレットに格納します</p>
                </div>
              </div>
              <button onClick={onClose} class="text-slate-400 hover:text-slate-700 text-sm">✕</button>
            </div>

            {/* 受注番号 & 枝番 */}
            <div class="grid grid-cols-3 gap-2">
              <div class="col-span-2">
                <label class="text-xs font-bold text-slate-700 block mb-1">
                  受注番号 <span class="text-red-500">*</span>:
                </label>
                <input
                  type="text"
                  value={orderNo}
                  onChange={(e) => setOrderNo(e.target.value)}
                  placeholder="例: 7010"
                  class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm font-mono text-slate-900 focus:bg-white focus:border-emerald-500 focus:outline-none"
                />
              </div>
              <div>
                <label class="text-xs font-bold text-slate-700 block mb-1">枝番:</label>
                <input
                  type="text"
                  value={branchNo}
                  onChange={(e) => setBranchNo(e.target.value)}
                  placeholder="01"
                  class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm font-mono text-slate-900 focus:bg-white focus:border-emerald-500 focus:outline-none"
                />
              </div>
            </div>

            {/* 色選択 */}
            <div>
              <label class="text-xs font-bold text-slate-700 block mb-1.5">
                版の色を選択 <span class="text-red-500">*</span>:
              </label>
              <div class="grid grid-cols-4 gap-2">
                {(colors || COLOR_PRESETS).map(preset => {
                  const isSelected = selectedColors.includes(preset.code);
                  return (
                    <button
                      key={preset.code}
                      type="button"
                      onClick={() => toggleColor(preset.code)}
                      className={`p-2 rounded-lg border-2 text-xs font-bold flex items-center gap-1.5 transition-all ${
                        isSelected
                          ? 'bg-emerald-50 border-emerald-500 text-emerald-900 shadow-sm'
                          : 'bg-white border-slate-200 text-slate-600 hover:border-slate-300'
                      }`}
                    >
                      <span

                        class="w-3.5 h-3.5 rounded-full shrink-0"
                      ></span>
                      <span class="truncate">{preset.code}</span>
                    </button>
                  );
                })}
              </div>
            </div>

            {/* 格納先パレット選択 */}
            <div>
              <label class="text-xs font-bold text-slate-700 block mb-1.5">

              </label>

                value={targetPalletId}
                onChange={(e) => setTargetPalletId(e.target.value)}
                class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 text-sm font-mono text-slate-900 focus:border-emerald-500 focus:bg-white focus:outline-none"
              >
                <option value="">-- パレットを選択してください --</option>
                <optgroup label="【空きパレット】">

                      <option key={p.id} value={p.id}>
                        【空き】エリア{p.area} : {p.id}
                      </option>
                    ))}

                <optgroup label="【保管中パレット（合積み・追加保管）】">
                  {allPallets
                    .filter(p => palletPlatesMap[p.id] && palletPlatesMap[p.id].length > 0)
                    .map(p => {
                      const count = palletPlatesMap[p.id].length;
                      const firstOrder = palletPlatesMap[p.id][0]?.orderNo;
                      return (
                        <option key={p.id} value={p.id}>
                          【合積み可】エリア{p.area} : {p.id} (現在: #{firstOrder}等 {count}版 保管中)

            </div>

            {/* 作業者名入力 */}
            <WorkerSelector
              workerName={workerName}
              setWorkerName={setWorkerName}
              customWorker={customWorker}

              isCustomWorker={isCustomWorker}
              setIsCustomWorker={setIsCustomWorker}
              workers={workers}

            {/* アクションボタン */}
            <div class="flex items-center gap-2 pt-2">
              <button
                type="button"
                onClick={onClose}
                class="flex-1 py-3 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold transition-colors"
              >
                キャンセル
              </button>
              <button
                type="button"
                onClick={handleExecute}
                class="flex-2 py-3 px-4 rounded-xl bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 text-white font-bold text-sm shadow-md shadow-emerald-500/20 transition-all flex items-center justify-center gap-2"
              >
                <i data-lucide="plus-circle" class="w-4 h-4"></i>
                <span>新規 {selectedColors.length}版 を入庫登録する</span>
              </button>
            </div>
          </div>
        </div>
      );
    }

    // --- ② ダイレクト出庫モーダル（保管中の版を選んで出庫） ---
    function DirectCheckOutModal({ plates, workers = WORKER_PRESETS, onClose, onConfirm }) {
      const storedPlates = plates.filter(p => p.status === 'IN_STORAGE');
      const [filterQuery, setFilterQuery] = useState('');
      const [selectedIds, setSelectedIds] = useState([]);

      const [workerName, setWorkerName] = useState((workers && workers[0]) || WORKER_PRESETS[0]);
      const [customWorker, setCustomWorker] = useState('');
      const [isCustomWorker, setIsCustomWorker] = useState(false);

      const effectiveWorker = isCustomWorker ? customWorker.trim() : workerName;

      // 保管中版を受注番号ごとにグループ化
      const orderGroups = useMemo(() => {
        const q = filterQuery.trim().toLowerCase();
        const filtered = q
          ? storedPlates.filter(p => p.orderNo.toLowerCase().includes(q) || p.currentPalletId?.toLowerCase().includes(q))
          : storedPlates;

        const map = {};
        filtered.forEach(p => {
          if (!map[p.orderNo]) {
            map[p.orderNo] = {
              orderNo: p.orderNo,
              branchNo: p.branchNo,
              palletId: p.currentPalletId,
              plates: []
            };
          }
          map[p.orderNo].plates.push(p);
        });
        return Object.values(map);
      }, [storedPlates, filterQuery]);

      const toggleSelect = (id) => {
        setSelectedIds(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
      };

      const toggleOrderGroup = (grpPlates) => {
        const grpIds = grpPlates.map(p => p.plateId);
        const allChecked = grpIds.every(id => selectedIds.includes(id));
        if (allChecked) {
          setSelectedIds(prev => prev.filter(id => !grpIds.includes(id)));
        } else {
          setSelectedIds(prev => Array.from(new Set([...prev, ...grpIds])));
        }
      };

      const handleExecute = () => {
        if (selectedIds.length === 0) return alert('出庫する版を少なくとも1つ選択してください。');
        if (!effectiveWorker) return alert('【必須】作業者名を入力または選択してください。');
        onConfirm(selectedIds, effectiveWorker);
      };

      return (
        <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fadeIn">
          <div class="bg-white border border-slate-200 rounded-2xl w-full max-w-lg shadow-2xl p-5 space-y-4 max-h-[90vh] overflow-y-auto">
            {/* ヘッダー */}
            <div class="flex items-center justify-between border-b border-slate-200 pb-3">
              <div class="flex items-center gap-2.5">
                <div class="w-9 h-9 rounded-xl bg-blue-100 text-blue-700 flex items-center justify-center shadow-sm">
                  <i data-lucide="log-out" class="w-5 h-5"></i>
                </div>
                <div>
                  <h3 class="font-bold text-base text-slate-900">パレットから出庫（作業開始）</h3>
                  <p class="text-xs text-slate-500">保管中の版を選択して現場での作業を開始します</p>
                </div>
              </div>
              <button onClick={onClose} class="text-slate-400 hover:text-slate-700 text-sm">✕</button>
            </div>

            {/* 検索フィルター */}
            <div class="relative">
              <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
              <input
                type="text"
                value={filterQuery}
                onChange={(e) => setFilterQuery(e.target.value)}
                placeholder="受注番号またはパレット番号で絞り込み..."
                class="w-full bg-slate-50 border border-slate-300 rounded-xl pl-9 pr-3 py-2 text-xs sm:text-sm text-slate-900 placeholder-slate-400 focus:bg-white focus:border-blue-500 focus:outline-none font-mono"
              />
            </div>

            {/* 保管中受注一覧 */}
            <div class="max-h-60 overflow-y-auto space-y-3 pr-1">
              {orderGroups.length === 0 ? (
                <div class="p-8 text-center text-slate-400 text-xs border-2 border-dashed border-slate-200 rounded-xl">
                  {filterQuery ? '該当する保管中版は見つかりませんでした。' : '現在保管中の版はありません。'}
                </div>
              ) : (
                orderGroups.map(grp => {
                  const grpIds = grp.plates.map(p => p.plateId);
                  const isAllChecked = grpIds.every(id => selectedIds.includes(id));

                  return (
                    <div key={grp.orderNo} class="p-3 rounded-xl bg-slate-50 border border-slate-200 space-y-2">
                      <div class="flex items-center justify-between border-b border-slate-200 pb-1.5">
                        <div class="flex items-center gap-2">
                          <span class="font-mono font-bold text-sm text-slate-900">#{grp.orderNo}</span>
                          <span class="text-xs font-mono px-2 py-0.5 rounded bg-blue-50 text-blue-700 border border-blue-200 font-bold">
                            パレット: {grp.palletId}
                          </span>
                        </div>
                        <button
                          type="button"
                          onClick={() => toggleOrderGroup(grp.plates)}
                          class="text-xs text-blue-600 hover:text-blue-800 font-bold"
                        >
                          {isAllChecked ? '受注解除' : '一括選択'}
                        </button>
                      </div>

                      <div class="grid grid-cols-2 gap-2">
                        {grp.plates.map(pl => {
                          const isChecked = selectedIds.includes(pl.plateId);
                          return (
                            <div
                              key={pl.plateId}
                              onClick={() => toggleSelect(pl.plateId)}
                              className={`p-2 rounded-xl border-2 cursor-pointer transition-all flex items-center justify-between ${
                                isChecked ? 'bg-blue-50 border-blue-500 shadow-sm' : 'bg-white border-slate-200 opacity-70'
                              }`}
                            >
                              <div class="flex items-center gap-2">
                                <span
                                  style={{ backgroundColor: pl.colorHex, color: pl.color === 'Y' || pl.color === '白' ? '#0F172A' : '#FFFFFF' }}
                                  class="w-5 h-5 rounded-full flex items-center justify-center text-[10px] font-bold"
                                >
                                  {pl.color.slice(0, 1)}
                                </span>
                                <span class="text-xs font-bold text-slate-800">{pl.color}版</span>
                              </div>
                              <input type="checkbox" checked={isChecked} onChange={() => {}} class="rounded text-blue-600 pointer-events-none w-4 h-4" />
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  );
                })
              )}
            </div>

            {/* 作業者名入力 */}
            <WorkerSelector
              workerName={workerName}
              setWorkerName={setWorkerName}
              customWorker={customWorker}
              setCustomWorker={setCustomWorker}
              isCustomWorker={isCustomWorker}
              setIsCustomWorker={setIsCustomWorker}
              workers={workers}
            />

            {/* アクションボタン */}
            <div class="flex items-center gap-2 pt-2">
              <button
                type="button"
                onClick={onClose}
                class="flex-1 py-3 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold transition-colors"
              >
                キャンセル
              </button>
              <button
                type="button"
                onClick={handleExecute}
                disabled={selectedIds.length === 0}
                class="flex-2 py-3 px-4 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 disabled:opacity-40 text-white font-bold text-sm shadow-md shadow-blue-500/20 transition-all flex items-center justify-center gap-2"
              >
                <i data-lucide="log-out" class="w-4 h-4"></i>
                <span>選択した {selectedIds.length}版 を出庫する</span>
              </button>
            </div>
          </div>
        </div>
      );
    }

    // --- ③ ダイレクト使用（作業中一覧・管理）モーダル ---
    function DirectInUseModal({ inUsePlates, inUseByOrder, onClose, onQuickReturn, onOpenCheckOut }) {
      return (
        <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fadeIn">
          <div class="bg-white border border-slate-200 rounded-2xl w-full max-w-lg shadow-2xl p-5 space-y-4 max-h-[90vh] overflow-y-auto">
            {/* ヘッダー */}
            <div class="flex items-center justify-between border-b border-slate-200 pb-3">

            {/* 作業中一覧 */}

                          <span>担当作業者: <strong>{group.worker || '未記録'}</strong></span>
                        </div>
                      </div>
                      <div class="text-right text-xs font-mono text-slate-500 bg-white px-2 py-0.5 rounded border border-slate-200">
                        {new Date(group.lastMovedAt).toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' })} 出庫
                      </div>
                    </div>

                    {/* 色チップ一覧 */}
                    <div class="flex items-center gap-1.5 flex-wrap">
                      {group.plates.map(pl => (
                        <span
                          key={pl.plateId}
                          style={{ backgroundColor: pl.colorHex, color: pl.color === 'Y' || pl.color === '白' ? '#0F172A' : '#FFFFFF' }}
                          class="text-xs font-bold px-2.5 py-1 rounded-md shadow-sm"
                        >
                          {pl.color}版
                        </span>
                      ))}
                    </div>

                    {/* 返却ボタン */}
                    <div class="pt-2 border-t border-slate-200 flex items-center justify-end">
                      <button
                        type="button"
                        onClick={() => onQuickReturn(group.orderNo)}
                        class="w-full py-2 px-3 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold flex items-center justify-center gap-1.5 transition-colors shadow-sm"
                      >
                        <i data-lucide="corner-down-left" class="w-4 h-4"></i>
                        <span>この受注の版をパレットに返却入庫する</span>
                      </button>
                    </div>
                  </div>
                ))
              )}
            </div>

            {/* 閉じるボタン */}
            <div class="pt-2">
              <button
                type="button"
                onClick={onClose}
                class="w-full py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs transition-colors"
              >
                閉じる
              </button>
            </div>
          </div>
        </div>
      );

    // --- ④ ダイレクト返却モーダル（使用中の版を選んでパレット返却） ---
    function DirectReturnModal({ inUsePlates, allPallets, palletPlatesMap, workers = WORKER_PRESETS, onClose, onConfirm }) {
      const [selectedIds, setSelectedIds] = useState(() => inUsePlates.map(p => p.plateId));
      const [targetPalletId, setTargetPalletId] = useState('');

      const [workerName, setWorkerName] = useState(inUsePlates[0]?.currentWorker || (workers && workers[0]) || WORKER_PRESETS[0]);
      const [customWorker, setCustomWorker] = useState('');
      const [isCustomWorker, setIsCustomWorker] = useState(false);

      const effectiveWorker = isCustomWorker ? customWorker.trim() : workerName;

      const toggleSelect = (id) => {
        setSelectedIds(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
      };

      const toggleAll = () => {
        if (selectedIds.length === inUsePlates.length) {
          setSelectedIds([]);
        } else {
          setSelectedIds(inUsePlates.map(p => p.plateId));
        }
      };

      const handleExecute = () => {
        if (selectedIds.length === 0) return alert('返却する版を少なくとも1つ選択してください。');
        if (!targetPalletId) return alert('返却先パレットを選択してください。');
        if (!effectiveWorker) return alert('【必須】作業者名を入力または選択してください。');
        onConfirm(selectedIds, targetPalletId, effectiveWorker);
      };

      return (
        <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fadeIn">
          <div class="bg-white border border-slate-200 rounded-2xl w-full max-w-lg shadow-2xl p-5 space-y-4 max-h-[90vh] overflow-y-auto">
            {/* ヘッダー */}
            <div class="flex items-center justify-between border-b border-slate-200 pb-3">
              <div class="flex items-center gap-2.5">
                <div class="w-9 h-9 rounded-xl bg-amber-100 text-amber-700 flex items-center justify-center shadow-sm">
                  <i data-lucide="corner-down-left" class="w-5 h-5"></i>
                </div>
                <div>
                  <h3 class="font-bold text-base text-slate-900">使用済み版のパレット返却・入庫</h3>
                  <p class="text-xs text-slate-500">作業が終わった版をパレットに格納します</p>
                </div>
              </div>
              <button onClick={onClose} class="text-slate-400 hover:text-slate-700 text-sm">✕</button>
            </div>

            {/* 版選択 */}
            {inUsePlates.length === 0 ? (
              <div class="p-8 text-center text-slate-400 text-xs border-2 border-dashed border-slate-200 rounded-xl">
                現在返却対象の使用中版はありません。
              </div>
            ) : (
              <>
                <div>
                  <div class="flex items-center justify-between mb-2">
                    <label class="text-xs font-bold text-slate-700">返却する版を選択:</label>
                    <button type="button" onClick={toggleAll} class="text-xs text-amber-600 font-bold">
                      {selectedIds.length === inUsePlates.length ? '全解除' : 'すべて選択'}
                    </button>
                  </div>
                  <div class="max-h-52 overflow-y-auto space-y-2 pr-1">
                    {inUsePlates.map(pl => {
                      const isChecked = selectedIds.includes(pl.plateId);
                      return (
                        <div
                          key={pl.plateId}
                          onClick={() => toggleSelect(pl.plateId)}
                          className={`p-2.5 rounded-xl border-2 cursor-pointer transition-all flex items-center justify-between ${
                            isChecked ? 'bg-amber-50 border-amber-500 shadow-sm' : 'bg-slate-50 border-slate-200 opacity-60'
                          }`}
                        >
                          <div class="flex items-center gap-2.5">
                            <span
                              style={{ backgroundColor: pl.colorHex, color: pl.color === 'Y' || pl.color === '白' ? '#0F172A' : '#FFFFFF' }}
                              class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold"
                            >
                              {pl.color.slice(0, 1)}
                            </span>
                            <div>
                              <div class="text-xs font-bold font-mono text-slate-900">
                                #{pl.orderNo} ({pl.color}版)
                              </div>
                              <div class="text-[10px] text-slate-500">
                                作業中: {pl.currentWorker || '未記録'}
                              </div>
                            </div>
                          </div>
                          <input type="checkbox" checked={isChecked} onChange={() => {}} class="rounded text-amber-600 pointer-events-none w-4 h-4" />
                        </div>
                      );
                    })}
                  </div>
                </div>

                {/* 返却先パレット選択 */}
                <div>
                  <label class="text-xs font-bold text-slate-700 block mb-1.5">
                    返却先パレット <span class="text-red-500">*</span>:
                  </label>
                  <select
                    value={targetPalletId}
                    onChange={(e) => setTargetPalletId(e.target.value)}
                    class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 text-sm font-mono text-slate-900 focus:border-amber-500 focus:bg-white focus:outline-none"
                  >
                    <option value="">-- 返却先パレットを選択してください --</option>
                    <optgroup label="【空きパレット】">
                      {allPallets
                        .filter(p => !palletPlatesMap[p.id] || palletPlatesMap[p.id].length === 0)
                        .map(p => (
                          <option key={p.id} value={p.id}>
                            【空き】エリア{p.area} : {p.id}
                          </option>
                        ))}
                    </optgroup>
                    <optgroup label="【保管中パレット（合積み・追加保管）】">
                      {allPallets
                        .filter(p => palletPlatesMap[p.id] && palletPlatesMap[p.id].length > 0)
                        .map(p => {
                          const count = palletPlatesMap[p.id].length;
                          const firstOrder = palletPlatesMap[p.id][0]?.orderNo;
                          return (
                            <option key={p.id} value={p.id}>
                              【合積み可】エリア{p.area} : {p.id} (現在: #{firstOrder}等 {count}版 保管中)
                            </option>
                          );
                        })}
                    </optgroup>
                  </select>
                </div>

                {/* 作業者名入力 */}
                <WorkerSelector
                  workerName={workerName}
                  setWorkerName={setWorkerName}
                  customWorker={customWorker}
                  setCustomWorker={setCustomWorker}
                  isCustomWorker={isCustomWorker}
                  setIsCustomWorker={setIsCustomWorker}
                  workers={workers}
                />

                {/* アクションボタン */}
                <div class="flex items-center gap-2 pt-2">
                  <button
                    type="button"
                    onClick={onClose}
                    class="flex-1 py-3 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold transition-colors"
                  >
                    キャンセル
                  </button>
                  <button
                    type="button"
                    onClick={handleExecute}
                    disabled={selectedIds.length === 0 || !targetPalletId}
                    class="flex-2 py-3 px-4 rounded-xl bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-600 hover:to-orange-700 disabled:opacity-40 text-white font-bold text-sm shadow-md shadow-amber-500/20 transition-all flex items-center justify-center gap-2"
                  >
                    <i data-lucide="corner-down-left" class="w-4 h-4"></i>
                    <span>選択した {selectedIds.length}版 を返却入庫する</span>
                  </button>
                </div>
              </>
            )}
          </div>
        </div>
      );
    }

    // --- 入出庫履歴モーダルコンポーネント ---
    function HistoryModal({ logs, onClose }) {
      const [filterOrder, setFilterOrder] = useState('');

      const filteredLogs = useMemo(() => {
        if (!filterOrder.trim()) return logs;
        return logs.filter(l => 
          l.orderNo.includes(filterOrder.trim()) ||
          l.worker.includes(filterOrder.trim()) ||
          l.palletId.includes(filterOrder.trim())
        );
      }, [logs, filterOrder]);

      // CSVエクスポート
      const handleExportCSV = () => {
        const header = '日時,アクション,受注番号,パレット,版,作業者\n';
        const rows = logs.map(l => 
          `"${l.timestamp}","${l.action === 'CHECK_OUT' ? '出庫' : '入庫'}","${l.orderNo}","${l.palletId}","${l.plateId}","${l.worker}"`
        ).join('\n');
        
        const bom = new Uint8Array([0xEF, 0xBB, 0xBF]);
        const blob = new Blob([bom, header + rows], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `印刷版_入出庫履歴_${new Date().toISOString().slice(0,10)}.csv`;
        a.click();
        URL.revokeObjectURL(url);
      };

      return (
        <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fadeIn">
          <div class="bg-white border border-slate-200 rounded-2xl w-full max-w-2xl shadow-2xl flex flex-col max-h-[85vh] overflow-hidden">
            {/* ヘッダー */}
            <div class="p-4 bg-slate-50 border-b border-slate-200 flex items-center justify-between">
              <div class="flex items-center gap-2">
                <i data-lucide="clipboard-list" class="w-5 h-5 text-blue-600"></i>
                <h3 class="font-bold text-base text-slate-900">入出庫 履歴ログ</h3>
                <span class="text-xs px-2.5 py-0.5 rounded-full bg-slate-200 text-slate-700 font-mono font-bold">
                  全 {logs.length} 件
                </span>
              </div>
              <div class="flex items-center gap-2">
                <button
                  onClick={handleExportCSV}
                  class="px-3 py-1.5 rounded-lg bg-white hover:bg-slate-100 border border-slate-300 text-xs font-semibold text-slate-700 flex items-center gap-1 transition-colors shadow-sm"
                >
                  <i data-lucide="download" class="w-3.5 h-3.5 text-blue-600"></i>
                  <span>CSV出力</span>
                </button>
                <button
                  onClick={onClose}
                  class="w-8 h-8 rounded-lg bg-white hover:bg-slate-100 text-slate-400 hover:text-slate-700 flex items-center justify-center text-sm border border-slate-200"
                >
                  ✕
                </button>
              </div>
            </div>

            {/* フィルター */}
            <div class="p-3 bg-slate-50/80 border-b border-slate-200">
              <input
                type="text"
                value={filterOrder}
                onChange={(e) => setFilterOrder(e.target.value)}
                placeholder="履歴内検索 (受注番号 / パレット / 作業者)..."
                class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-xs text-slate-900 placeholder-slate-400 focus:outline-none focus:border-blue-500 font-mono"
              />
            </div>

            {/* テーブル */}
            <div class="p-4 overflow-y-auto flex-1 space-y-2">
              {filteredLogs.length === 0 ? (
                <div class="text-center py-10 text-slate-400 text-xs">
                  該当する履歴はありません。
                </div>
              ) : (
                filteredLogs.map(l => (
                  <div 
                    key={l.id}
                    class="p-3 rounded-xl bg-slate-50/80 border border-slate-200 flex items-center justify-between text-xs gap-3 hover:bg-slate-100/70 transition-colors"
                  >
                    <div class="flex items-center gap-3">
                      <span className={`px-2 py-1 rounded-md font-bold text-[10px] ${
                        l.action === 'CHECK_OUT'
                          ? 'bg-blue-100 text-blue-800 border border-blue-200'
                          : 'bg-emerald-100 text-emerald-800 border border-emerald-200'
                      }`}>
                        {l.action === 'CHECK_OUT' ? '出庫' : '入庫'}
                      </span>
                      <div>
                        <div class="flex items-center gap-2">
                          <span class="font-mono font-bold text-slate-900">#{l.orderNo}</span>
                          <span class="font-mono text-[11px] text-slate-600 bg-white px-1.5 py-0.5 rounded border border-slate-200">
                            {l.palletId}
                          </span>
                          <span class="text-slate-700 font-medium">{l.color}</span>
                        </div>
                        <div class="text-[10px] text-slate-400 font-mono mt-0.5">
                          {l.plateId}
                        </div>
                      </div>
                    </div>

                    <div class="text-right">
                      <div class="text-slate-800 font-semibold flex items-center justify-end gap-1">
                        <i data-lucide="user" class="w-3.5 h-3.5 text-slate-400"></i>
                        <span>{l.worker}</span>
                      </div>
                      <div class="text-[10px] text-slate-400 font-mono mt-0.5">
                        {l.timestamp}
                      </div>
                    </div>
                  </div>
                ))
              )}
            </div>
          </div>
        </div>
      );
    }

    // --- ⚙️ システム設定ページコンポーネント (パレット追加・担当者追加・カラー追加・データ管理) ---
    function SettingsPage({
      pallets, setPallets,
      workers, setWorkers,
      colors, setColors,
      plates, setPlates,
      logs, setLogs,
      palletPlatesMap,
      onBackToMap,
      showToast,
      defaultPallets,
      defaultWorkers,
      defaultColors,
      initialPlates,
      initialLogs
    }) {
      const [activeTab, setActiveTab] = useState(() => {
        try {
          const params = new URLSearchParams(window.location.search);
          const t = params.get('tab');
          if (t && ['workers', 'colors', 'pallets', 'data'].includes(t.toLowerCase())) {
            return t.toLowerCase();
          }
        } catch (e) {}
        return 'workers';
      }); // 'workers' | 'colors' | 'pallets' | 'data'

      // ================= 1. 担当者設定ステート =================
      const [newWorkerName, setNewWorkerName] = useState('');

      const handleAddWorker = (e) => {
        if (e) e.preventDefault();
        const trimmed = newWorkerName.trim();
        if (!trimmed) return alert('担当者名を入力してください。');
        if (workers.includes(trimmed)) return alert('その担当者名は既に登録されています。');
        setWorkers(prev => [...prev, trimmed]);
        setNewWorkerName('');
        showToast(`👨‍🏭 担当者「${trimmed}」を追加登録しました！`);
      };

      const handleDeleteWorker = (targetName) => {
        if (workers.length <= 1) return alert('担当者をすべて削除することはできません（最低1名必要）。');
        if (confirm(`担当者「${targetName}」をリストから削除しますか？`)) {
          setWorkers(prev => prev.filter(w => w !== targetName));
          showToast(`🗑️ 担当者「${targetName}」を削除しました。`);
        }
      };

      const handleResetWorkers = () => {
        if (confirm('担当者リストを初期状態（6名）に戻しますか？')) {
          setWorkers(defaultWorkers);
          showToast('🔄 担当者リストを初期状態に戻しました。');
        }
      };

      // ================= 2. カラー設定ステート =================
      const [newColorCode, setNewColorCode] = useState('');
      const [newColorName, setNewColorName] = useState('');
      const [newColorHex, setNewColorHex] = useState('#8B5CF6');
      const [newColorTextColor, setNewColorTextColor] = useState('#FFFFFF');

      const isBaseColor = (code) => ['C', 'M', 'Y', 'K'].includes(code);

      const handleAddColor = (e) => {
        if (e) e.preventDefault();
        const codeTrim = newColorCode.trim();
        const nameTrim = newColorName.trim();
        if (!codeTrim) return alert('色コード（例: 特色3, 銀, 蛍光P 等）を入力してください。');
        if (colors.some(c => c.code === codeTrim)) return alert(`色コード「${codeTrim}」は既に登録されています。`);

        const newEntry = {
          code: codeTrim,
          name: nameTrim || `${codeTrim}版`,
          bg: newColorHex,
          text: newColorTextColor,
          border: newColorHex.toUpperCase() === '#FFFFFF' ? '#CBD5E1' : undefined
        };

        setColors(prev => [...prev, newEntry]);
        setNewColorCode('');
        setNewColorName('');
        setNewColorHex('#8B5CF6');
        showToast(`🎨 新しい刷色・特色「${codeTrim}」を追加登録しました！`);
      };

      const handleDeleteColor = (code) => {
        if (isBaseColor(code)) return alert('基本CMYKカラー（C, M, Y, K）は削除できません。');
        if (confirm(`色「${code}」を削除しますか？`)) {
          setColors(prev => prev.filter(c => c.code !== code));
          showToast(`🗑️ 色「${code}」を削除しました。`);
        }
      };

      const handleResetColors = () => {
        if (confirm('カラー設定を初期プリセットに戻しますか？')) {
          setColors(defaultColors);
          showToast('🔄 カラー設定を初期プリセットに戻しました。');
        }
      };

      // ================= 3. パレット設定ステート =================
      const [palletAreaFilter, setPalletAreaFilter] = useState('ALL');
      const [newArea, setNewArea] = useState('A');
      const [newRow, setNewRow] = useState('');
      const [newCol, setNewCol] = useState('1');
      const [customPalletId, setCustomPalletId] = useState('');

      const uniqueAreas = useMemo(() => {
        const s = new Set(pallets.map(p => p.area));
        return Array.from(s).sort();
      }, [pallets]);

      const filteredPallets = useMemo(() => {
        if (palletAreaFilter === 'ALL') return pallets;
        return pallets.filter(p => p.area === palletAreaFilter);
      }, [pallets, palletAreaFilter]);

      const handleAddPallet = (e) => {
        if (e) e.preventDefault();
        const areaTrim = newArea.trim().toUpperCase();
        if (!areaTrim) return alert('エリア名を入力してください（例: A, B, C 等）。');
        
        let targetId = customPalletId.trim();
        const rowNum = parseInt(newRow, 10);
        const colNum = parseInt(newCol, 10) || 1;

        if (!targetId) {
          if (!rowNum) return alert('行番号を入力するか、パレットIDを直接入力してください。');
          const rowStr = String(rowNum).padStart(2, '0');
          targetId = `${areaTrim}-${rowStr}-${colNum}`;
        }

        if (pallets.some(p => p.id === targetId)) {
          return alert(`パレットID「${targetId}」は既に存在します。別のIDを指定してください。`);
        }

        const newPalletObj = {
          id: targetId,
          area: areaTrim,
          row: rowNum || 99,
          col: colNum,
          label: targetId
        };

        setPallets(prev => [...prev, newPalletObj]);
        setCustomPalletId('');
        setNewRow('');
        showToast(`📦 パレット【${targetId}】を追加しました！`);
      };

      const handleQuickAddRow = (targetArea) => {
        const existingInArea = pallets.filter(p => p.area === targetArea);
        const maxRow = existingInArea.reduce((max, p) => Math.max(max, p.row || 0), 0);
        const nextRow = maxRow + 1;
        const rowStr = String(nextRow).padStart(2, '0');

        const newP1 = { id: `${targetArea}-${rowStr}-1`, area: targetArea, row: nextRow, col: 1, label: `${targetArea}-${rowStr}-1` };
        const newP2 = { id: `${targetArea}-${rowStr}-2`, area: targetArea, row: nextRow, col: 2, label: `${targetArea}-${rowStr}-2` };

        setPallets(prev => [...prev, newP1, newP2]);
        showToast(`🚀 エリア${targetArea}に 行${nextRow}（${newP1.id}, ${newP2.id} 計2マス）を追加しました！`);
      };

      const handleQuickAddNewArea = (areaLetter, rowCount = 5) => {
        if (pallets.some(p => p.area === areaLetter)) {
          return alert(`エリア「${areaLetter}」は既に存在します。`);
        }
        const created = [];
        for (let r = 1; r <= rowCount; r++) {
          const rowStr = String(r).padStart(2, '0');
          created.push({ id: `${areaLetter}-${rowStr}-1`, area: areaLetter, row: r, col: 1, label: `${areaLetter}-${rowStr}-1` });
          created.push({ id: `${areaLetter}-${rowStr}-2`, area: areaLetter, row: r, col: 2, label: `${areaLetter}-${rowStr}-2` });
        }
        setPallets(prev => [...prev, ...created]);
        showToast(`✨ 新エリア【${areaLetter}】（計${created.length}マス）を新設しました！`);
      };

      const handleDeletePallet = (pId) => {
        const stored = palletPlatesMap[pId] || [];
        if (stored.length > 0) {
          return alert(`パレット【${pId}】には現在 ${stored.length}版 が保管されているため削除できません。先に出庫または別のパレットへ移動してください。`);
        }
        if (confirm(`パレット【${pId}】を削除しますか？`)) {
          setPallets(prev => prev.filter(p => p.id !== pId));
          showToast(`🗑️ パレット【${pId}】を削除しました。`);
        }
      };

      const handleResetPallets = () => {
        if (confirm('パレット構成を初期状態（エリアA: 22マス、エリアB: 24マス 計46マス）に戻しますか？')) {
          setPallets(defaultPallets);
          showToast('🔄 パレット構成を初期状態に戻しました。');
        }
      };

      // ================= 4. データ管理・バックアップ =================
      const handleExportAllJSON = () => {
        const backupData = {
          version: '1.0',
          exportedAt: new Date().toISOString(),
          pallets,
          workers,
          colors,
          plates,
          logs
        };
        const blob = new Blob([JSON.stringify(backupData, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `印刷版倉庫管理_全バックアップ_${new Date().toISOString().slice(0, 10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
        showToast('💾 全設定・データをJSONファイルとしてエクスポートしました！');
      };

      const handleImportJSON = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const data = JSON.parse(event.target.result);
            if (!data.pallets || !data.plates) {
              return alert('無効なバックアップファイルです。必要なデータキーが見つかりません。');
            }
            if (confirm('バックアップファイルからデータを復元しますか？現在のデータは上書きされます。')) {
              if (data.pallets) setPallets(data.pallets);
              if (data.workers) setWorkers(data.workers);
              if (data.colors) setColors(data.colors);
              if (data.plates) setPlates(data.plates);
              if (data.logs) setLogs(data.logs);
              showToast('✅ バックアップデータから正常に復元しました！');
            }
          } catch (err) {
            alert('ファイルの読み込みに失敗しました: ' + err.message);
          }
        };
        reader.readAsText(file);
      };

      const handleFullReset = () => {
        if (confirm('⚠️ システム内の全データ（パレット、版、入出庫ログ、担当者、カラー）をすべて初期サンプル状態に完全リセットしますか？')) {
          setPallets(defaultPallets);
          setWorkers(defaultWorkers);
          setColors(defaultColors);
          setPlates(initialPlates);
          setLogs(initialLogs);
          showToast('🔄 全データを完全リセットしました。');
        }
      };

      return (
        <div class="max-w-7xl mx-auto w-full p-4 sm:p-6 space-y-6 animate-fadeIn">
          
          {/* 上部ヘッダーバー */}
          <div class="bg-white border border-slate-200 rounded-2xl p-4 sm:p-5 shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div class="flex items-center gap-3">
              <div class="w-11 h-11 rounded-xl bg-slate-900 text-white flex items-center justify-center shadow-md">
                <i data-lucide="settings" class="w-6 h-6 text-blue-400"></i>
              </div>
              <div>
                <div class="flex items-center gap-2">
                  <h2 class="text-lg sm:text-xl font-black text-slate-900">システム設定・マスター管理</h2>
                  <span class="text-xs px-2 py-0.5 rounded-full bg-slate-100 text-slate-700 font-semibold border border-slate-300">
                    管理者機能
                  </span>
                </div>
                <p class="text-xs text-slate-500">
                  現場の運用に合わせてパレット・担当作業者・刷色カラー・データの追加・編集・管理が行えます
                </p>
              </div>
            </div>

            <button
              onClick={onBackToMap}
              class="py-2.5 px-4 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-xs sm:text-sm font-bold flex items-center justify-center gap-2 shadow-md shadow-blue-500/20 transition-all cursor-pointer whitespace-nowrap"
            >
              <i data-lucide="arrow-left" class="w-4 h-4"></i>
              <span>全体図（マップ）に戻る</span>
            </button>
          </div>

          {/* タブ切り替えバー */}
          <div class="flex items-center gap-2 overflow-x-auto pb-1 border-b border-slate-200">
            <button
              onClick={() => setActiveTab('workers')}
              className={`py-2.5 px-4 rounded-xl font-bold text-xs sm:text-sm flex items-center gap-2 transition-all whitespace-nowrap ${
                activeTab === 'workers'
                  ? 'bg-blue-600 text-white shadow-md shadow-blue-500/20'
                  : 'bg-white hover:bg-slate-50 text-slate-700 border border-slate-200'
              }`}
            >
              <i data-lucide="users" class="w-4 h-4"></i>
              <span>担当者（作業者）設定</span>
              <span className={`text-[10px] px-1.5 py-0.2 rounded-full ${activeTab === 'workers' ? 'bg-white/20' : 'bg-slate-100 text-slate-600'}`}>
                {workers.length}名
              </span>
            </button>

            <button
              onClick={() => setActiveTab('colors')}
              className={`py-2.5 px-4 rounded-xl font-bold text-xs sm:text-sm flex items-center gap-2 transition-all whitespace-nowrap ${
                activeTab === 'colors'
                  ? 'bg-blue-600 text-white shadow-md shadow-blue-500/20'
                  : 'bg-white hover:bg-slate-50 text-slate-700 border border-slate-200'
              }`}
            >
              <i data-lucide="palette" class="w-4 h-4"></i>
              <span>刷色・特色カラー設定</span>
              <span className={`text-[10px] px-1.5 py-0.2 rounded-full ${activeTab === 'colors' ? 'bg-white/20' : 'bg-slate-100 text-slate-600'}`}>
                {colors.length}色
              </span>
            </button>

            <button
              onClick={() => setActiveTab('pallets')}
              className={`py-2.5 px-4 rounded-xl font-bold text-xs sm:text-sm flex items-center gap-2 transition-all whitespace-nowrap ${
                activeTab === 'pallets'
                  ? 'bg-blue-600 text-white shadow-md shadow-blue-500/20'
                  : 'bg-white hover:bg-slate-50 text-slate-700 border border-slate-200'
              }`}
            >
              <i data-lucide="grid" class="w-4 h-4"></i>
              <span>パレット・倉庫エリア設定</span>
              <span className={`text-[10px] px-1.5 py-0.2 rounded-full ${activeTab === 'pallets' ? 'bg-white/20' : 'bg-slate-100 text-slate-600'}`}>
                {pallets.length}枠
              </span>
            </button>

            <button
              onClick={() => setActiveTab('data')}
              className={`py-2.5 px-4 rounded-xl font-bold text-xs sm:text-sm flex items-center gap-2 transition-all whitespace-nowrap ${
                activeTab === 'data'
                  ? 'bg-blue-600 text-white shadow-md shadow-blue-500/20'
                  : 'bg-white hover:bg-slate-50 text-slate-700 border border-slate-200'
              }`}
            >
              <i data-lucide="database" class="w-4 h-4"></i>
              <span>データ管理・バックアップ</span>
            </button>
          </div>

          {/* ================= タブ1: 担当者設定 ================= */}
          {activeTab === 'workers' && (
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 items-start">
              {/* 新規担当者追加カード */}
              <div class="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm space-y-4">
                <div class="flex items-center gap-2.5 border-b border-slate-100 pb-3">
                  <div class="w-8 h-8 rounded-lg bg-blue-100 text-blue-700 flex items-center justify-center">
                    <i data-lucide="user-plus" class="w-4 h-4"></i>
                  </div>
                  <div>
                    <h3 class="font-bold text-sm text-slate-900">新規担当者の追加</h3>
                    <p class="text-[11px] text-slate-500">入出庫時に記録される作業者名</p>
                  </div>
                </div>

                <form onSubmit={handleAddWorker} class="space-y-3">
                  <div>
                    <label class="text-xs font-bold text-slate-700 block mb-1">
                      作業者氏名 <span class="text-red-500">*</span>:
                    </label>
                    <input
                      type="text"
                      value={newWorkerName}
                      onChange={(e) => setNewWorkerName(e.target.value)}
                      placeholder="例: 木村 拓也 (印刷OP)"
                      class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm text-slate-900 focus:bg-white focus:border-blue-500 focus:outline-none"
                    />
                  </div>

                  <button
                    type="submit"
                    class="w-full py-2.5 px-4 rounded-xl bg-blue-600 hover:bg-blue-700 active:scale-[0.98] text-white font-bold text-xs flex items-center justify-center gap-1.5 shadow-md shadow-blue-500/20 transition-all cursor-pointer"
                  >
                    <i data-lucide="plus" class="w-4 h-4"></i>
                    <span>担当者を追加する</span>
                  </button>
                </form>

                <div class="pt-3 border-t border-slate-100">
                  <button
                    type="button"
                    onClick={handleResetWorkers}
                    class="w-full py-2 px-3 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs font-semibold flex items-center justify-center gap-1 transition-colors"
                  >
                    <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
                    <span>初期担当者（6名）に戻す</span>
                  </button>
                </div>
              </div>

              {/* 登録済み担当者一覧リスト */}
              <div class="lg:col-span-2 bg-white border border-slate-200 rounded-2xl p-5 shadow-sm space-y-4">

                  <div>
                    <h3 class="font-bold text-sm text-slate-900">バックアップ ＆ 復元</h3>
                    <p class="text-[11px] text-slate-500">JSON形式で丸ごと保存・復元できます</p>
                  </div>
                </div>

                <div class="space-y-3">
                  <button
                    type="button"
                    onClick={handleExportAllJSON}
                    class="w-full py-3 px-4 rounded-xl bg-blue-600 hover:bg-blue-700 active:scale-[0.98] text-white font-bold text-xs sm:text-sm flex items-center justify-center gap-2 shadow-md shadow-blue-500/20 transition-all cursor-pointer"
                  >
                    <i data-lucide="download" class="w-4 h-4"></i>
                    <span>全データをJSONエクスポート（ダウンロード）</span>
                  </button>

                  <label class="w-full py-3 px-4 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold text-xs sm:text-sm flex items-center justify-center gap-2 transition-colors cursor-pointer border border-slate-200 block text-center">
                    <i data-lucide="upload" class="w-4 h-4 inline-block"></i>
                    <span>JSONファイルからデータを復元（インポート）</span>
                    <input
                      type="file"
                      accept=".json"
                      onChange={handleImportJSON}
                      class="hidden"
                    />
                  </label>

                  <div class="pt-4 border-t border-slate-100">
                    <button
                      type="button"
                      onClick={handleFullReset}
                      class="w-full py-2.5 px-3 rounded-xl bg-red-50 hover:bg-red-100 text-red-700 font-bold text-xs border border-red-200 flex items-center justify-center gap-1.5 transition-colors"
                    >
                      <i data-lucide="alert-triangle" class="w-4 h-4"></i>
                      <span>全データを初期サンプル状態に完全リセット</span>
                    </button>
                  </div>
                </div>
              </div>

            </div>
          )}

        </div>
      );
    }

    // Reactアプリのマウント
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
